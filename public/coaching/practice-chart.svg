<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" role="img"
     aria-label="연습 과정을 표현한 개념 이미지">
  <!--
    여울디앤씨 데이터 섹션 그림 (2026-09-28)

    바꾼 이유 — 원래는 아파트 스카이라인 + 주황 화살표(apt.png)였다.
      · 아파트 그림은 분양 전문 회사의 흔적이라 온라인 종합 광고 대행사와 안 맞는다
      · 주황이 파란 브랜드색과 따로 놀아서 색조만 돌려 쓰던 임시 상태였다
    그림 파일 대신 SVG 로 만든 이유 — 어떤 화면에서도 선명하고 배경이 투명하며
    브랜드 색(#7A3045)을 정확히 쓸 수 있다.

    🔴 지켜야 할 두 가지
      1. 글자를 한 자도 넣지 않는다 — 화면의 제목·수치와 겹쳐 읽기 어려워진다
      2. 오른쪽 약 27%(x>1100)는 비워 둔다 — 그 자리에 「누적 캠페인 100+ /
         목표 ROAS 2~4x」 가 겹쳐 놓인다. 채우면 숫자가 안 읽힌다
  -->
  <defs>
    <linearGradient id="ydBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#7A3045" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#7A3045" stop-opacity=".52"/>
    </linearGradient>
    <linearGradient id="ydBarHi" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#7A3045" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#9D5265" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="ydLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#E8D6DD"/>
      <stop offset="50%"  stop-color="#9D5265"/>
      <stop offset="100%" stop-color="#552133"/>
    </linearGradient>
    <linearGradient id="ydArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7A3045" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#7A3045" stop-opacity="0"/>
    </linearGradient>
    <filter id="ydGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#7A3045" flood-opacity=".26"/>
    </filter>
  </defs>

  <g id="ydShift" transform="translate(0,34)">
  <!-- 바닥 기준선 -->
  <line x1="40" y1="530" x2="1120" y2="530" stroke="#E8D6DD" stroke-width="2" stroke-linecap="round"/>

  <!-- 옅은 눈금선 -->
  <g stroke="#F5ECEF" stroke-width="1.5" stroke-dasharray="6 10" stroke-linecap="round">
    <line x1="40" y1="434" x2="1120" y2="434"/>
    <line x1="40" y1="338" x2="1120" y2="338"/>
    <line x1="40" y1="242" x2="1120" y2="242"/>
    <line x1="40" y1="146" x2="1120" y2="146"/>
  </g>

  <!-- 막대 18개 — 물결치며 우상향 (운영이 오르내리며 개선되는 모습) -->
  <g>
    <rect x="48"   y="462" width="42" height="68"  rx="10" fill="url(#ydBar)"/>
    <rect x="108"  y="436" width="42" height="94"  rx="10" fill="url(#ydBar)"/>
    <rect x="168"  y="456" width="42" height="74"  rx="10" fill="url(#ydBar)"/>
    <rect x="228"  y="408" width="42" height="122" rx="10" fill="url(#ydBar)"/>
    <rect x="288"  y="424" width="42" height="106" rx="10" fill="url(#ydBar)"/>
    <rect x="348"  y="376" width="42" height="154" rx="10" fill="url(#ydBar)"/>
    <rect x="408"  y="394" width="42" height="136" rx="10" fill="url(#ydBar)"/>
    <rect x="468"  y="344" width="42" height="186" rx="10" fill="url(#ydBarHi)"/>
    <rect x="528"  y="364" width="42" height="166" rx="10" fill="url(#ydBar)"/>
    <rect x="588"  y="312" width="42" height="218" rx="10" fill="url(#ydBarHi)"/>
    <rect x="648"  y="330" width="42" height="200" rx="10" fill="url(#ydBar)"/>
    <rect x="708"  y="278" width="42" height="252" rx="10" fill="url(#ydBarHi)"/>
    <rect x="768"  y="298" width="42" height="232" rx="10" fill="url(#ydBar)"/>
    <rect x="828"  y="244" width="42" height="286" rx="10" fill="url(#ydBarHi)"/>
    <rect x="888"  y="266" width="42" height="264" rx="10" fill="url(#ydBar)"/>
    <rect x="948"  y="210" width="42" height="320" rx="10" fill="url(#ydBarHi)"/>
    <rect x="1008" y="232" width="42" height="298" rx="10" fill="url(#ydBar)"/>
    <rect x="1068" y="176" width="42" height="354" rx="10" fill="url(#ydBarHi)"/>
  </g>

  <!-- 곡선 아래 옅은 면 -->
  <path d="M70 482 C 230 466, 340 414, 470 376 S 730 300, 860 250 S 1030 188, 1096 160
           L 1096 530 L 70 530 Z" fill="url(#ydArea)"/>

  <!-- 상승 곡선 -->
  <path d="M70 482 C 230 466, 340 414, 470 376 S 730 300, 860 250 S 1030 188, 1096 160"
        fill="none" stroke="url(#ydLine)" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#ydGlow)"/>

  <!-- 데이터 점 -->
  <g>
    <circle cx="258" cy="452" r="13" fill="#fff" stroke="#E8D6DD" stroke-width="6"/>
    <circle cx="560" cy="350" r="13" fill="#fff" stroke="#9D5265" stroke-width="6"/>
    <circle cx="860" cy="250" r="15" fill="#fff" stroke="#7A3045" stroke-width="7"/>
    <circle cx="1096" cy="160" r="16" fill="#fff" stroke="#552133" stroke-width="8"/>
  </g>

  <!-- 노이즈를 걷어낸다는 뜻 — 왼쪽엔 흩어진 점이 많고 오른쪽으로 갈수록 정돈된다 -->
  <g fill="#B07385" opacity=".5">
    <circle cx="86"  cy="286" r="6"/>
    <circle cx="140" cy="230" r="4"/>
    <circle cx="196" cy="310" r="6"/>
    <circle cx="252" cy="222" r="4"/>
    <circle cx="312" cy="274" r="5"/>
    <circle cx="376" cy="206" r="4"/>
    <circle cx="444" cy="250" r="5"/>
    <circle cx="516" cy="190" r="4"/>
    <circle cx="600" cy="214" r="4"/>
    <circle cx="700" cy="166" r="4"/>
    <circle cx="812" cy="140" r="3"/>
    <circle cx="930" cy="118" r="3"/>
  </g>
  </g>
</svg>
